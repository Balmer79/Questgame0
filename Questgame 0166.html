	<p align="right">Time: 5</p><p align="justify"></p><p align="justify">You make it to a point about 50 feet from the tower without being spotted. From there you can see the entire tower; it is exactly as the woman described it. <i><b>Pick a number</b> and add your <span class="attribute">Perception</span> bonus: </i></p><p align="justify"></p><p align="justify"><i>- If 2-7, <b>turn to <a class="chapterlink" href="./Questgame%200145.html">145</a>.</b></i></p><p align="justify"><i>- If 8-12, <b>turn to <a class="chapterlink" href="./Questgame%200161.html">161</a>.</b></i></p>
