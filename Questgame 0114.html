	<p align="right"><span class="time">Time: 5</span></p><p align="justify"></p><p align="justify">As you walk along the road, you see a small man in a brown cloak walking south towards you.</p><p align="justify"></p><p align="justify"><i>&#8226; If you stop and talk, thinking perhaps to enlist his aid, <b>turn to <a class="chapterlink" href="./Questgame%200117.html">117</a>.</b> </i></p><p align="justify"><i>&#8226; If you walk past him without stopping or speaking, <b>turn to <a class="chapterlink" href="./Questgame%200129.html">129</a>.</b> </i></p><p align="justify"><i>&#8226; If you attack him, <b>turn to <a class="chapterlink" href="./Questgame%200121.html">121</a>.</b> </i></p>
