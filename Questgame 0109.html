	<p align="right"><i>Time: 5</i></p><p align="justify">As you cross the stream, a <span class="enemy">wolf</span> leaps from the brush and attacks you. You are surprised and must fight the wolf. Its melee <span class="attribute">OB is 0</span>, its <span class="attribute">DB is 1</span>, and its <span class="attribute">Endurance is 20</span>.</p><p align="justify"></p><p align="justify"><i>- If you defeat the wolf, <b>turn to <a class="chapterlink" href="./Questgame%200134.html">134</a>.</b> </i></p><p align="justify"><i>- If you are defeated, <b>turn to <a class="chapterlink" href="./Questgame%200172.html">172</a>.</b> </i></p><p align="justify"><i>- If you run away, <b>turn to <a class="chapterlink" href="./Questgame%200125.html">125</a>.</b> </i></p>
