	<p align="right"><span class="time">Time: 5</span></p><p align="justify"></p><p align="justify">You reach the girl without disturbing the Southron; she is unconscious. Now comes the hard part; you must pick up the girl, throw her over your shoulder, and sneak out. <i><b>Pick a number</b> and add your <span class="attribute">Trickery</span> bonus: </i></p><p align="justify"></p><p align="justify"><i>- If 2-8, you make a slight noise; turn to <b><a class="chapterlink" href="./Questgame%200149.html">149</a>.</b></i></p><p align="justify"><i>- If 9-12, turn to <b><a class="chapterlink" href="./Questgame%200175.html">175</a>.</b></i></p>
