	<p align="right"><span class="time">Time: 5</span></p><p align="justify"></p><p align="justify">You carefully take the wire attached to the handle and try to attach it to a piece of your rope that you tie to a nearby rock. You hope that this will keep the wire taut and the trap inactive. <i>Pick a number and add your Trickery bonus: </i></p><p align="justify"></p><p align="justify"><i>- If 2-6, turn to <b><a class="chapterlink" href="./Questgame%200135.html">135</a>.</b></i></p><p align="justify"><i>- If 7-12, turn to <b><a class="chapterlink" href="./Questgame%200150.html">150</a>.</b></i></p>
