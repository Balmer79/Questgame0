	<p align="right"><span class="time">Time:5</span></p><p>&nbsp;</p><p>You detect that the handle has a trap attached to it. You think that the trap may start a rock slide.</p><p>&nbsp;</p><p><i>- If you pull on the handle, <b>turn to <a class="chapterlink" href="./Questgame%200135.html">135</a>.</b></i></p><p><i>- If you try to disarm the trap, <b>turn to <a class="chapterlink" href="./Questgame%200167.html">167</a>.</b></i></p><p><i>- Otherwise, you must climb the bluff, <b>turn to <a class="chapterlink" href="./Questgame%200156.html">156</a>.</b></i></p>
